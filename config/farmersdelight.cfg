            minecraft:beaches
            minecraft:stone_beach
            minecraft:cold_beach
         >

        # If true, biomes is a whitelist. If false, biomes is a blacklist.
        B:biomesAreWhitelist=true

        # Internal marker used to decide whether this wild crop's biome list has already received its generated default values.
        B:biomesInitialized=true

        # Chance of generating clusters. Smaller value = more frequent. Set to 0 to disable this generator. [range: 0 ~ 2147483647, default: 30]
        I:chance=30

        # Dimension ids used by this wild crop generator. When dimensionsAreWhitelist is true, the crop only generates in these dimensions. When false, the crop skips these dimensions.
